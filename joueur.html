<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b7242e"><title>Le Trésor de Valou</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px;background:repeating-linear-gradient(90deg,#b7242e 0 40px,#fff8e8 40px 80px);font-family:system-ui,Arial,sans-serif;color:#38221c}.app{width:min(100%,420px);background:#fff9eb;border:5px solid white;border-radius:22px;box-shadow:0 9px 0 #7d1c24,0 20px 45px #441a1855;padding:28px 22px;text-align:center}h1{font-size:clamp(2.1rem,9vw,3rem);line-height:1.05;color:#b7242e;margin:12px 0}p{line-height:1.4}.subtitle{font-weight:800;color:#1c5949;letter-spacing:.05em;font-size:.85rem}.emoji{font-size:2.4rem}input{width:100%;padding:16px;border:2px solid #dfc39a;border-radius:12px;font:inherit;font-size:1.1rem;text-align:center;margin:12px 0}button{width:100%;padding:17px;border:0;border-radius:12px;background:#b7242e;color:white;font:inherit;font-size:1.15rem;font-weight:800;cursor:pointer;min-height:56px}button:disabled{opacity:.65}.number{font-size:clamp(6rem,27vw,9rem);font-weight:900;line-height:1;color:#b7242e;margin:12px 0}.hidden{display:none}.small{font-size:.75rem;color:#76564b;margin-top:22px}.error{color:#b7242e;min-height:1.3em}footer{font-size:.75rem;font-weight:800;color:#76564b;margin-top:20px}</style></head><body><main class="app"><div class="emoji">🐂 🎉 🐗</div><div class="subtitle">30 ANS DE VALENTIN</div><h1>Le Trésor<br>de Valou</h1><div id="form"><p>Découvre ton équipe !</p><input id="name" maxlength="40" autocomplete="given-name" placeholder="Ton prénom" aria-label="Ton prénom"><button id="draw">🎲 Tirer mon équipe</button><p class="error" id="error" role="status"></p></div><section id="result" class="hidden" aria-live="polite"><p id="hello"></p><p>Tu es dans l'équipe</p><div class="number" id="number"></div><p>Bonne aventure ! 🎉</p></section><footer>CÉVENNES × PAYS BASQUE · FÉRIA 2026</footer><p class="small">Un tirage par téléphone. Sans serveur, les équipes ne sont pas équilibrées entre les téléphones.</p></main><script>const $=id=>document.getElementById(id);const key='valou-random-draw-v1';let saved;try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}function show(v){$('form').classList.add('hidden');$('result').classList.remove('hidden');$('hello').textContent='Bienvenue '+v.name+' !';$('number').textContent=v.team}if(saved&&Number.isInteger(saved.team)&&saved.team>=1&&saved.team<=8)show(saved);$('draw').onclick=()=>{const name=$('name').value.trim();if(!name){$('error').textContent='Entre ton prénom.';return}const a=new Uint32Array(1);crypto.getRandomValues(a);const v={name,team:a[0]%8+1};try{localStorage.setItem(key,JSON.stringify(v))}catch(e){}show(v)}</script></body></html>
