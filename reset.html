<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réinitialiser — Le Trésor de Valou</title><style>body{font-family:system-ui,sans-serif;background:repeating-linear-gradient(90deg,#b7242e 0 38px,#fff8e8 38px 76px);min-height:100dvh;display:grid;place-items:center;margin:0;padding:20px}.card{background:#fff9eb;border:5px solid white;border-radius:20px;padding:30px;max-width:400px;text-align:center;box-shadow:0 8px 0 #7d1c24}h1{color:#b7242e}button,a{display:block;box-sizing:border-box;width:100%;padding:16px;border-radius:12px;font:inherit;font-weight:700;margin-top:15px}button{background:#b7242e;color:white;border:0}a{color:#1c5949}p{line-height:1.5}</style></head><body><main class="card"><h1>🔐 Réinitialisation</h1><p>Cette page est réservée à l'organisateur.</p><p>Effacer les noms et recommencer le tirage <strong>sur ce téléphone uniquement</strong> ?</p><button id="reset">🗑️ Réinitialiser les équipes</button><a href="equipes.html">← Retour au jeu</a><p id="status" role="status"></p></main><script>document.getElementById('reset').onclick=()=>{if(!confirm('Confirmer la suppression des équipes et du tirage sur ce téléphone ?'))return;localStorage.removeItem('valou-team-list-v1');localStorage.removeItem('valou-random-draw-v1');document.getElementById('status').textContent='Réinitialisation effectuée sur cet appareil.';document.getElementById('reset').disabled=true}</script></body></html>
